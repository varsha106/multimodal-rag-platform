[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-rag-platform"
version = "0.1.0"
description = "A local, production-style multimodal RAG reference implementation with hybrid retrieval and grounded citations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Varsha Puli" }
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "sentence-transformers>=3.0,<4.0",
  "faiss-cpu>=1.8,<2.0",
  "rank-bm25>=0.2.2,<1.0",
  "langchain>=0.3,<1.0",
  "langchain-core>=0.3,<1.0",
  "pypdf>=4.2,<6.0",
  "numpy>=1.26,<3.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
  "ruff>=0.6,<1.0"
]

[project.scripts]
rag-demo = "multimodal_rag.cli:main"
rag-api = "multimodal_rag.api:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
